version: traverse-board-naming.v2
status: accepted
non_authorizing_compatibility_migrations: true

brand:
  english: Traverse Board
  chinese: 针路簿
  full: Traverse Board · 针路簿
  approval_status: owner_approved_with_recorded_residual_name_risk
  tagline_en: The model navigates. The runtime keeps the truth.
  tagline_zh: 针有所向，路有所记；牵星知位，行有所据。
  legacy_display_name: Prayu

repository:
  previous: Qiyuanqiii/CTF-CyberAgent-Workbench
  canonical: Qiyuanqiii/Traverse-Board
  slug: Traverse-Board
  slug_status: approved_for_migration
  full_bilingual_name_is_not_a_valid_slug: true

rules:
  presentation_only_by_default: true
  rename_protocols: false
  rename_database_schema: false
  rename_go_packages: false
  rename_openapi_fields: false
  rename_cli_in_first_phase: false
  rename_data_directories_in_first_phase: false
  rename_package_identity_in_first_phase: false
  first_use_requires_technical_subtitle: true
  max_prominent_theme_modules_per_screen: 6
  rewrite_historical_adrs: false

v1_corrections:
  diff_alias:
    old: Wake · 航迹
    new: Change Track · 变更航迹
    reason: wake_is_an_existing_run_protocol_and_control_message_semantic
  run_fix:
    name: Kamal · 牵星板
    status: conceptual_reserved_until_a_trusted_projection_exists
  embedded_analyzer_wording:
    avoid: Rust Analyzer
    use: Rust-implemented deterministic WASI Analyzer guest

