models:
  default_provider: mock
  default_model: mock-cyber-agent

routing:
  ctf:
    provider: mock
    model: mock-cyber-agent
  script:
    provider: mock
    model: mock-code
  learn:
    provider: mock
    model: mock-fast
  code:
    provider: mock
    model: mock-code
  review:
    provider: mock
    model: mock-cyber-agent

providers:
  mock:
    type: mock
    secrets: none

# Documentation-only example. This repository file is not loaded as runtime
# Provider configuration and must never contain credentials or private headers.
# Configure the trusted process environment instead:
#   CYBERAGENT_OPENAI_API_KEY=<secret>
#   CYBERAGENT_OPENAI_BASE_URL=https://api.openai.com
#   CYBERAGENT_OPENAI_MODEL=gpt-4.1-mini
# The API key may alternatively be stored under the `openai` entry in the
# Go-owned operating-system credential store.
openai_compatible_example:
  provider_name: openai
  type: openai_compatible
  transport: openai_chat_completions
  default_base_url: https://api.openai.com
  default_model: gpt-4.1-mini
  timeout_seconds: 60
  request_headers: [Authorization, Content-Type, Accept]
  compatibility_profile: strict_chat_completions
  runtime_loaded: false
  secrets: environment_or_system_store_only

# Documentation-only example for the keyless local provider. The registry
# enables Ollama only when the endpoint and model are configured explicitly
# in the trusted process environment:
#   CYBERAGENT_OLLAMA_BASE_URL=http://127.0.0.1:11434
#   CYBERAGENT_OLLAMA_MODEL=llama3.2:3b
# Only loopback hosts are accepted; the provider never scans the LAN, never
# follows a redirect or proxy, and never installs or pulls models.
ollama_example:
  provider_name: ollama
  type: ollama
  transport: ollama_chat
  default_base_url: http://127.0.0.1:11434
  timeout_seconds: 60
  request_headers: [Content-Type, Accept]
  capability_probe: /api/show
  compatibility_profile: strict_ollama_chat
  runtime_loaded: false
  secrets: none
